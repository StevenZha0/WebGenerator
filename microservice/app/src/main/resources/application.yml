spring:
  application:
    name: web-generator-app
  profiles:
    active: local
  # session
  session:
    store-type: redis
    # 30 days expire
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      ttl: 3600
server:
  port: 8125
  servlet:
    context-path: /api
    # 30 days expire
    session:
      cookie:
        max-age: 2592000
# 应用部署配置
code:
  # 部署应用的访问域名（对应 nginx 地址）
  deploy-host: http://localhost
  # 部署目录默认无需配置：会自动定位到仓库根目录下的 tmp/code_deploy，
  # 单体服务和微服务两种启动方式都会落到同一个目录（见 ProjectPathUtils）
  # 需要改成其他目录时，任选一种方式覆盖（注意必须和 nginx 容器挂载的目录一致）：
  #   1. 环境变量 CODE_DEPLOY_DIR
  #   2. 启动参数 -Dcode.deploy.dir
  #   3. 在本文件配置 code.deploy-dir
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: true
      log-responses: true
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.zy.webgenerator.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# Dubbo
dubbo:
  registry:
    register-mode: instance
  protocol:
    name: tri
    port: 50053
  consumer:
    timeout: 120000
  provider:
    timeout: 120000
  application:
    qos-enable: true
    qos-port: 0
