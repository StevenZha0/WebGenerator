spring:
  application:
    name: yu-ai-code-mother-backend
  session:
    store-type: redis
    timeout: 2592000
  profiles:
    active: local



server:
  port: 8123
  servlet:
    context-path: /api
  session:
    cookie:
      max-age: 25920000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yupi.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
